<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOB Tools | Premium Gaming</title>
    <style>
        /* Gaming Typography */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #09090b;
            --bg-panel: #121318;
            --bg-input: #0a0b0e;
            --red-main: #ff1e1e;
            --red-dark: #990000;
            --red-glow: rgba(255, 30, 30, 0.25);
            --text-main: #f0f0f0;
            --text-dim: #888a99;
            --border: #2a2b36;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 30, 30, 0.05) 0%, transparent 50%),
                linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Navigation */
        nav {
            width: 100%;
            height: 70px;
            background: rgba(18, 19, 24, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--red-main);
            text-shadow: 0 0 15px var(--red-glow);
        }

        /* Menu Button */
        .menu-wrapper {
            position: relative;
        }

        .menu-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 4px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-btn:hover {
            border-color: var(--red-main);
            color: var(--red-main);
            box-shadow: 0 0 15px var(--red-glow);
        }

        .dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            background: var(--bg-panel);
            border: 1px solid var(--red-dark);
            border-radius: 4px;
            width: 200px;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--red-glow);
            overflow: hidden;
        }

        .dropdown.active {
            display: flex;
            animation: slideDown 0.2s ease forwards;
        }

        .dropdown button {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            padding: 1rem;
            text-align: left;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dropdown button:last-child {
            border-bottom: none;
        }

        .dropdown button:hover {
            background: rgba(255, 30, 30, 0.1);
            color: var(--red-main);
            padding-left: 1.5rem;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Main Content Container */
        main {
            margin-top: 100px;
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding-bottom: 4rem;
        }

        .tool-view {
            display: none;
            flex-direction: column;
            gap: 2rem;
        }

        .tool-view.active {
            display: flex;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Headers */
        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-left: 4px solid var(--red-main);
            padding-left: 1rem;
            text-shadow: 0 0 10px var(--red-glow);
        }

        /* Panels */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            transition: all 0.3s ease;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red-main), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .panel:focus-within {
            border-color: var(--red-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px var(--red-glow);
        }

        .panel:focus-within::before {
            opacity: 1;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-header h2 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel:focus-within .panel-header h2 {
            color: var(--red-main);
        }

        /* Buttons */
        .action-btn {
            background: rgba(255, 30, 30, 0.1);
            border: 1px solid var(--red-dark);
            color: var(--red-main);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--red-main);
            color: var(--bg-base);
            box-shadow: 0 0 15px var(--red-main);
        }

        .merge-btn-container {
            display: flex;
            justify-content: center;
            margin: -0.5rem 0;
            z-index: 10;
        }

        .merge-btn {
            background: var(--red-main);
            color: #000;
            font-size: 1.5rem;
            padding: 1rem 3rem;
            border: none;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 30, 30, 0.4);
            transition: all 0.2s ease;
            transform: skewX(-10deg);
        }

        .merge-btn span {
            display: inline-block;
            transform: skewX(10deg);
        }

        .merge-btn:hover {
            box-shadow: 0 0 30px var(--red-main);
            transform: skewX(-10deg) scale(1.05);
        }

        /* Textareas */
        textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--bg-base);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            resize: vertical;
            outline: none;
            line-height: 1.6;
            box-sizing: border-box;
            padding: 1rem;
            border-radius: 4px;
            min-height: 120px;
        }

        .merger-textarea {
            min-height: 200px;
            white-space: pre;
        }

        textarea::placeholder {
            color: #333644;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red-main); }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--red-main);
            color: #000;
            padding: 1rem 2rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            box-shadow: 0 0 20px var(--red-glow);
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .logo { font-size: 1.5rem; }
            .section-title { font-size: 2rem; }
            nav { padding: 0 1rem; }
            textarea { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav>
        <div class="logo">AOB<span>TOOL</span></div>
        <div class="menu-wrapper">
            <button class="menu-btn" onclick="toggleMenu()" id="menuBtn">☰</button>
            <div class="dropdown" id="dropdownMenu">
                <button onclick="switchTool('converter')">AOB Converter</button>
                <button onclick="switchTool('merger')">AOB Merger</button>
            </div>
        </div>
    </nav>

    <main>
        <!-- TOOL 1: CONVERTER -->
        <div id="tool-converter" class="tool-view active">
            <h1 class="section-title">AOB Converter</h1>
            
            <!-- Hex Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2>Hexadecimal</h2>
                    <button class="action-btn" onclick="copyToClipboard('hexInput')">Copy</button>
                </div>
                <textarea id="hexInput" 
                          placeholder="e.g. 00 FF 66 AA ?? 66" 
                          oninput="convert('hex')" 
                          onblur="formatActive('hex')"></textarea>
            </div>

            <!-- Bytes Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2>C++ Bytes</h2>
                    <button class="action-btn" onclick="copyToClipboard('bytesInput')">Copy</button>
                </div>
                <textarea id="bytesInput" 
                          placeholder="e.g. 0x00, 0xFF, 0x66, 0xAA, 0x??, 0x66" 
                          oninput="convert('bytes')" 
                          onblur="formatActive('bytes')"></textarea>
            </div>
        </div>

        <!-- TOOL 2: MERGER -->
        <div id="tool-merger" class="tool-view">
            <h1 class="section-title">AOB Merger</h1>
            
            <!-- Input Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2>Input Signatures (Multiple Lines)</h2>
                </div>
                <textarea id="mergeInput" class="merger-textarea" 
                          placeholder="Paste multiple AOBs here...&#10;FF FF FF FF 66 44 ?? 00 66&#10;FF FF FF FF 77 44 ?? 00 67&#10;FF 55 FF FF 66 44 ?? 00 ??"></textarea>
            </div>

            <!-- Merge Action Button -->
            <div class="merge-btn-container">
                <button class="merge-btn" onclick="executeMerge()">
                    <span>Merge AOBs</span>
                </button>
            </div>

            <!-- Output Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2>Merged Output</h2>
                    <button class="action-btn" onclick="copyToClipboard('mergeOutput')">Copy</button>
                </div>
                <textarea id="mergeOutput" placeholder="FF ?? FF FF ?? 44 ?? 00 ??" readonly></textarea>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Copied!</div>

    <script>
        // --- MENU LOGIC ---
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const wrapper = document.querySelector('.menu-wrapper');
            const menu = document.getElementById('dropdownMenu');
            if (!wrapper.contains(event.target)) {
                menu.classList.remove('active');
            }
        });

        function switchTool(toolName) {
            document.getElementById('tool-converter').classList.remove('active');
            document.getElementById('tool-merger').classList.remove('active');
            
            document.getElementById('tool-' + toolName).classList.add('active');
            document.getElementById('dropdownMenu').classList.remove('active');
        }

        // --- CONVERTER LOGIC ---
        function normalizeAOB(input) {
            let cleaned = input.replace(/0x/gi, '');
            cleaned = cleaned.replace(/[^0-9A-Fa-f\?]/g, '');
            return cleaned.toUpperCase();
        }

        function toHex(normalized) {
            if (!normalized) return '';
            const pairs = normalized.match(/.{1,2}/g) || [];
            return pairs.map(p => {
                if (p === '?') return '??';
                if (p.length === 1 && p !== '?') return '0' + p;
                return p;
            }).join(' ');
        }

        function toBytes(normalized) {
            if (!normalized) return '';
            const pairs = normalized.match(/.{1,2}/g) || [];
            return pairs.map(p => {
                let val = p;
                if (p === '?') val = '??';
                if (p.length === 1 && p !== '?') val = '0' + p;
                return '0x' + val;
            }).join(', ');
        }

        function convert(source) {
            const hexEl = document.getElementById('hexInput');
            const bytesEl = document.getElementById('bytesInput');

            if (source === 'hex') {
                const norm = normalizeAOB(hexEl.value);
                bytesEl.value = toBytes(norm);
            } else if (source === 'bytes') {
                const norm = normalizeAOB(bytesEl.value);
                hexEl.value = toHex(norm);
            }
        }

        function formatActive(source) {
            const el = document.getElementById(source + 'Input');
            const norm = normalizeAOB(el.value);
            
            if (source === 'hex') {
                el.value = toHex(norm);
            } else if (source === 'bytes') {
                el.value = toBytes(norm);
            }
        }

        // --- MERGER LOGIC ---
        function executeMerge() {
            const inputText = document.getElementById('mergeInput').value;
            // Split into lines, trim spaces, and ignore empty lines
            const lines = inputText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            if (lines.length === 0) {
                document.getElementById('mergeOutput').value = '';
                return;
            }

            // Parse lines into arrays of bytes
            const parsedLines = lines.map(line => {
                const normalized = normalizeAOB(line);
                return normalized.match(/.{1,2}/g) || [];
            });

            // Find the maximum length among all provided AOBs
            let maxLength = 0;
            parsedLines.forEach(arr => {
                if (arr.length > maxLength) maxLength = arr.length;
            });

            let mergedAOB = [];

            // Compare bytes column by column
            for (let i = 0; i < maxLength; i++) {
                let currentByte = null;
                let isWildcard = false;

                for (let j = 0; j < parsedLines.length; j++) {
                    let byte = parsedLines[j][i];
                    
                    // Handle single '?' or standard '??'
                    if (byte === '?') byte = '??';
                    if (byte && byte.length === 1 && byte !== '?') byte = '0' + byte;

                    // If a line is shorter, or byte is wildcard, mark position as wildcard
                    if (!byte || byte === '??') {
                        isWildcard = true;
                        break;
                    }

                    if (currentByte === null) {
                        currentByte = byte; // First byte found for this column
                    } else if (currentByte !== byte) {
                        isWildcard = true;  // Mismatch found
                        break;
                    }
                }

                mergedAOB.push(isWildcard ? '??' : currentByte);
            }

            document.getElementById('mergeOutput').value = mergedAOB.join(' ');
        }

        // --- UTILS ---
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            if (!el.value) return;

            el.select();
            el.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(el.value).then(() => {
                showToast();
            });
        }

        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
