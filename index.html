<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOB Converter | Premium Classic</title>
    <style>
        /* Premium Typography Imports */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-dark: #0f1014;
            --panel-bg: #16171d;
            --gold: #d4af37;
            --gold-dim: #a68420;
            --text-main: #e0e0e0;
            --text-dim: #777;
            --border: #2a2b36;
            --glow: rgba(212, 175, 55, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin: 4rem 0 3rem;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #e6c875, #d4af37, #e6c875);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            font-weight: 700;
        }

        header p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* Layout */
        .container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            width: 90%;
            max-width: 850px;
            margin-bottom: 4rem;
        }

        /* Panel Styling */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
            position: relative;
        }

        .panel:focus-within {
            border-color: var(--gold-dim);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px var(--glow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.8rem;
        }

        .panel-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin: 0;
            color: var(--gold);
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Button Styling */
        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .copy-btn:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Textarea Styling */
        textarea {
            width: 100%;
            height: 140px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            resize: vertical;
            outline: none;
            line-height: 1.6;
            box-sizing: border-box;
            word-spacing: 2px;
        }

        textarea::placeholder {
            color: #3a3b46;
        }

        /* Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: var(--bg-dark); 
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--border); 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dim); 
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            background: var(--gold);
            color: var(--bg-dark);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            .panel { padding: 1.2rem; }
            .panel-header h2 { font-size: 1.3rem; }
            textarea { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>AOB Converter</h1>
        <p>Seamless Translation between Hex & Bytes</p>
    </header>

    <div class="container">
        <!-- Hex Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>Hexadecimal</h2>
                <button class="copy-btn" onclick="copyToClipboard('hexInput')">Copy</button>
            </div>
            <textarea id="hexInput" 
                      placeholder="e.g. 00 FF 66 AA ?? 66" 
                      oninput="convert('hex')" 
                      onblur="formatActive('hex')"></textarea>
        </div>

        <!-- Bytes Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>C++ Bytes</h2>
                <button class="copy-btn" onclick="copyToClipboard('bytesInput')">Copy</button>
            </div>
            <textarea id="bytesInput" 
                      placeholder="e.g. 0x00, 0xFF, 0x66, 0xAA, 0x??, 0x66" 
                      oninput="convert('bytes')" 
                      onblur="formatActive('bytes')"></textarea>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Copied to clipboard</div>

    <script>
        /**
         * Normalizes any input into a contiguous string of valid hex/wildcard characters.
         * Strips commas, '0x', and whitespace.
         */
        function normalizeAOB(input) {
            // Remove '0x' or '0X'
            let cleaned = input.replace(/0x/gi, '');
            // Remove everything except Hex digits (0-9, A-F) and Wildcards (?)
            cleaned = cleaned.replace(/[^0-9A-Fa-f\?]/g, '');
            return cleaned.toUpperCase();
        }

        /**
         * Converts normalized string to Hex format: "00 FF 66 AA ?? 66"
         */
        function toHex(normalized) {
            if (!normalized) return '';
            // Match pairs of characters
            const pairs = normalized.match(/.{1,2}/g) || [];
            return pairs.map(p => {
                if (p === '?') return '??';
                if (p.length === 1 && p !== '?') return '0' + p;
                return p;
            }).join(' ');
        }

        /**
         * Converts normalized string to Bytes format: "0x00, 0xFF, 0x66, 0xAA, 0x??, 0x66"
         */
        function toBytes(normalized) {
            if (!normalized) return '';
            // Match pairs of characters
            const pairs = normalized.match(/.{1,2}/g) || [];
            return pairs.map(p => {
                let val = p;
                if (p === '?') val = '??';
                if (p.length === 1 && p !== '?') val = '0' + p;
                return '0x' + val;
            }).join(', ');
        }

        /**
         * Real-time sync. Updates the inactive field while typing.
         */
        function convert(source) {
            const hexEl = document.getElementById('hexInput');
            const bytesEl = document.getElementById('bytesInput');

            if (source === 'hex') {
                const norm = normalizeAOB(hexEl.value);
                bytesEl.value = toBytes(norm);
            } else if (source === 'bytes') {
                const norm = normalizeAOB(bytesEl.value);
                hexEl.value = toHex(norm);
            }
        }

        /**
         * Formats the currently active field cleanly when the user clicks away (onblur).
         */
        function formatActive(source) {
            const el = document.getElementById(source + 'Input');
            const norm = normalizeAOB(el.value);
            
            if (source === 'hex') {
                el.value = toHex(norm);
            } else if (source === 'bytes') {
                el.value = toBytes(norm);
            }
        }

        /**
         * Copies contents to clipboard and triggers elegant toast notification
         */
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            if (!el.value) return;

            el.select();
            el.setSelectionRange(0, 99999); /* For mobile devices */
            navigator.clipboard.writeText(el.value).then(() => {
                showToast();
            });
        }

        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
